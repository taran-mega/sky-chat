<!DOCTYPE html>
<html lang = "en">
    
    <!-- HEAD -->
    <head>
        
        <!-- Meta Data -->
        <meta charset = "UTF-8">
        <meta name = "viewport" content = "width = device-width, initial-scale= 1.0">
        
        <!-- Title -->
        <title>Search</title>
        
        <!-- CSS -->
        <link rel = "stylesheet" href = "StyleSheets/search.css">
    </head>
    
    <!-- BODY -->
    <body>
        
        <!-- Main Search Area -->
        <div id = "search-area">
            
            <!-- Search Bar -->
            <input
                type = "search"
                id = "search-bar"
                placeholder = "Search users..."
            >
            
            <!-- Search Btn -->
            <button
            id = "search-btn"
            onClick = "sendRequest()"
            >
                <div id = "text">Search</div>
                <div class = "loadingCircle"></div>
            </button>
        </div>
        
        <!-- Results -->
        <div id = "results">
            <!-- Search results will appear here -->
        </div>
    
        <!-- Script -->
        <script src = "Scripts/search.js"></script>
    </body>
</html>
